[project]
name = "agent-memory-benchmark"
version = "0.1.0"
description = "A provider-neutral benchmark harness for agent memory systems"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "Redis, Inc." }]
keywords = ["agent-memory", "benchmark", "longmemeval", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx",
    "openai",
    "python-dotenv",
]

[project.optional-dependencies]
mem0 = ["mem0ai"]
langmem = ["langchain-openai", "langmem"]
zep = ["zep-cloud"]
graphiti = ["graphiti-core>=0.29"]
supermemory = ["supermemory"]
google = ["google-cloud-aiplatform[agent-engines]>=1.95", "google-genai>=1"]
aws = ["bedrock-agentcore", "boto3"]
oracle = ["oracleagentmemory>=26.4.0", "oracledb", "tiktoken"]
all-providers = [
    "bedrock-agentcore",
    "boto3",
    "google-cloud-aiplatform[agent-engines]>=1.95",
    "google-genai>=1",
    "graphiti-core>=0.29",
    "langchain-openai",
    "langmem",
    "mem0ai",
    "oracleagentmemory>=26.4.0",
    "oracledb",
    "supermemory",
    "tiktoken",
    "zep-cloud",
]

[project.scripts]
memory-bench = "agent_memory_benchmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_benchmark"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
